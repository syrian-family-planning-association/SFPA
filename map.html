<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخريطة التفاعلية - جمعية تنظيم الأسرة السورية</title>

<!-- أيقونة التبويب -->
<link rel="icon" type="image/jpeg" href="final%20logo.jpg">

<!-- استدعاء خط Cairo الاحترافي -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- استدعاء أيقونات FontAwesome الاحترافية -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- استدعاء مكتبة Leaflet CSS الخاصة بالخريطة -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
:root {
    --purple: #25005c;
    --orange: #f6511d;
    --card-text: #111111;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Cairo', sans-serif;
    background: #11002c;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* الشريط العلوي */
.header {
    background: var(--purple);
    color: white;
    padding: 10px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    z-index: 10;
    height: 60px;
    flex-shrink: 0;
}

.header h1 {
    font-size: 18px;
    font-weight: 800;
}

.back-btn {
    background: var(--orange);
    color: white;
    padding: 6px 16px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.3s ease, background 0.3s ease;
}

.back-btn:hover {
    transform: scale(1.05);
    background: #e04515;
}

/* حاوية الصفحة والجانبية */
.main-container {
    display: flex;
    flex-direction: row;
    width: 100%;
    height: calc(100vh - 60px);
    position: relative;
}

/* حاوية الخريطة */
#map {
    flex: 1;
    height: 100%;
    width: 100%;
    min-height: 300px;
    z-index: 1;
}

/* قائمة جانبية لعرض المراكز والفلترة */
.sidebar {
    width: 380px;
    background: rgba(17, 0, 44, 0.98);
    backdrop-filter: blur(12px);
    border-right: 1px solid rgba(255, 255, 255, 0.1);
    padding: 15px;
    z-index: 10;
    color: white;
    height: 100%;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    box-shadow: -5px 0 20px rgba(0,0,0,0.4);
}

.sidebar h2 {
    font-size: 16px;
    margin-bottom: 10px;
    color: var(--orange);
    border-bottom: 2px solid rgba(255,255,255,0.1);
    padding-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* عداد النتائج المتحرك */
.count-badge {
    background: rgba(246, 81, 29, 0.2);
    color: var(--orange);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    border: 1px solid var(--orange);
}

/* عناصر الفلترة والبحث */
.filter-group {
    margin-bottom: 10px;
}

.filter-group label {
    display: block;
    font-size: 11px;
    margin-bottom: 3px;
    color: #ccc;
    font-weight: 600;
}

.filter-select, .search-input {
    width: 100%;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    color: white;
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    outline: none;
    transition: all 0.3s ease;
}

.filter-select option {
    background: #25005c;
    color: white;
}

.filter-select:focus, .search-input:focus {
    border-color: var(--orange);
    background: rgba(255, 255, 255, 0.18);
    box-shadow: 0 0 10px rgba(246, 81, 29, 0.3);
}

/* قائمة الكروت مع حركات التدفق */
.centers-list-container {
    flex: 1;
    overflow-y: auto;
    padding-left: 5px;
    margin-top: 5px;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

.center-item {
    background: rgba(255, 255, 255, 0.06);
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid rgba(255, 255, 255, 0.05);
    animation: fadeInUp 0.4s ease forwards;
}

.center-item:hover {
    background: rgba(246, 81, 29, 0.2);
    border-color: var(--orange);
    transform: translateX(-4px) scale(1.01);
}

/* كرت نشط عند النقر عليه */
.center-item.active {
    background: rgba(246, 81, 29, 0.35);
    border-color: var(--orange);
    box-shadow: 0 0 15px rgba(246, 81, 29, 0.4);
}

.center-item .badge {
    display: inline-block;
    background: var(--orange);
    color: white;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 4px;
    margin-bottom: 4px;
    font-weight: 700;
}

.center-item h4 {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 2px;
    color: #ffffff;
}

.center-item p {
    font-size: 11px;
    opacity: 0.85;
    color: #dddddd;
}

/* تأثير نبض ودوران الدبابيس على الخريطة */
@keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(246, 81, 29, 0.8); }
    70% { transform: scale(1.1); box-shadow: 0 0 0 14px rgba(246, 81, 29, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(246, 81, 29, 0); }
}

.custom-pulse-marker {
    background: var(--orange);
    border: 2px solid #ffffff;
    border-radius: 50%;
    animation: pulse 2s infinite;
    box-shadow: 0 0 12px rgba(0,0,0,0.6);
}

/* تخصيص النافذة المنبثقة Popup */
.leaflet-popup-content-wrapper {
    font-family: 'Cairo', sans-serif;
    border-radius: 12px;
    padding: 5px;
    text-align: right;
    direction: rtl;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.leaflet-popup-content h3 {
    color: var(--purple);
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 3px;
}

.leaflet-popup-content .popup-gov {
    color: var(--orange);
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 3px;
}

.leaflet-popup-content p {
    color: #555;
    font-size: 11px;
    margin: 0;
}

/* استجابة الشاشات الصغيرة */
@media (max-width: 768px) {
    .main-container {
        flex-direction: column-reverse;
    }
    .sidebar {
        width: 100%;
        height: 260px;
        border-right: none;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    #map {
        height: calc(100vh - 320px);
    }
}
</style>
</head>

<body>

    <div class="header">
        <h1>الخريطة التفاعلية لمراكز جمعية تنظيم الأسرة السورية</h1>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> الرئيسية</a>
    </div>

    <div class="main-container">
        <!-- عنصر الخريطة -->
        <div id="map"></div>

        <!-- قائمة المراكز الجانبية المتقدمة -->
        <div class="sidebar">
            <h2>
                <span>مراكز الفروع الطبية</span>
                <span id="count-badge" class="count-badge">0 مركز</span>
            </h2>
            
            <!-- خانة البحث الفوري -->
            <div class="filter-group">
                <label for="search-input"><i class="fa-solid fa-magnifying-glass"></i> بحث سريع عن مركز أو منطقة:</label>
                <input type="text" id="search-input" class="search-input" placeholder="اكتب للبحث الفوري...">
            </div>

            <!-- قائمة فلترة المحافظات -->
            <div class="filter-group">
                <label for="gov-select"><i class="fa-solid fa-filter"></i> تصفية حسب المحافظة:</label>
                <select id="gov-select" class="filter-select">
                    <option value="all">🌐 كافة المحافظات (عرض الكل)</option>
                    <option value="دمشق">دمشق</option>
                    <option value="ريف دمشق">ريف دمشق</option>
                    <option value="حلب">حلب</option>
                    <option value="حمص">حمص</option>
                    <option value="حماة">حماة</option>
                    <option value="اللاذقية">اللاذقية</option>
                    <option value="طرطوس">طرطوس</option>
                    <option value="درعا">درعا</option>
                    <option value="السويداء">السويداء</option>
                    <option value="القنيطرة">القنيطرة</option>
                    <option value="دير الزور">دير الزور</option>
                </select>
            </div>

            <div class="centers-list-container" id="centers-list"></div>
        </div>
    </div>

    <!-- استدعاء مكتبة Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // إعداد الخريطة وتمركزها على سورية
        const map = L.map('map', {
            zoomControl: true
        }).setView([35.151347, 39.056396], 7);

        // إضافة طبقة خريطة نظيفة
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // قائمة كافة المراكز والعيادات
        const centers = [
            { gov: "دمشق", name: "عيادة نسائية - الحلَبوني", lat: 33.30393, lng: 36.17379, desc: "الحلبوني - جادة ابن سينا - جانب دار ابن كثير - بناء الفرخ ط1" },
            { gov: "دمشق", name: "مركز صحة القدم", lat: 33.472085, lng: 36.287085, desc: "لقدم جانب بلدية القدم -بالقرب من مخفر الشرطه .. شارع مكتب السفريات" },
            { gov: "دمشق", name: "مركز دعم وتمكين المرأة - مساكن برزة", lat: 33.30127, lng: 36.18341, desc: "مساكن برزة- دوار الطاهي- مكتبة السلام" },
            { gov: "دمشق", name: "عيادة نسائية - حفير تحتا", lat: 33.649793, lng: 36.437831, desc: "حفير التحتا جنب جامع الفاروق" },

            { gov: "ريف دمشق", name: "عيادة نسائية - جرمانا", lat: 33.484317, lng: 36.343546, desc: "عيادة جرمانا امتداد البلدية القديمة خلف الملعب البلدي دخله صيدلية أميرة كركوش" },
            { gov: "ريف دمشق", name: "عيادة نسائية - يبرود", lat: 33.970692, lng: 36.658000, desc: "بيرود شارع الماركات بناء عساف بالقرب من مركز الحولات الهرم" },
            { gov: "ريف دمشق", name: "عيادة نسائية - دوما", lat: 33.569619, lng: 36.409019, desc: "قبو جامع ابراهيم الخليل" },
            { gov: "ريف دمشق", name: "وحدة حماية الأسرة - قدسيا", lat: 33.542762, lng: 36.196467, desc: "ساحة تروي، ناحية مركز قدسيا" },
            { gov: "ريف دمشق", name: "مركز دعم وتمكين المرأة - قدسيا", lat: 33.551874, lng: 36.212537, desc: "ساحة العمري - اتجاه يسار - موقف الخياطين - جانب معجنات الخضراء" },
            { gov: "ريف دمشق", name: "مركز دعم وتمكين المرأة - دوما", lat: 33.568566, lng: 36.406974, desc: "شارع الجلاء- جانب إبراهيم الخليل- مستوصف الجامع." },
            { gov: "ريف دمشق", name: "مركز دعم وتمكين المرأة - كفر بطنا", lat: 33.306900, lng: 36.223800, desc: "كفر بطنا - بعد دوار النور ب50 متر" },
            { gov: "ريف دمشق", name: "مركز دعم وتمكين المرأة - اشرفية صحنايا", lat: 33.424555, lng: 36.222021, desc: "صحنايا البلد - اخر السرافيس - مقابل ماركت القصار" },
            { gov: "ريف دمشق", name: "مركز دعم وتمكين المرأة - يبرود", lat: 33.935250, lng: 36.665440, desc: "اول الكورنيش الشمالي - نزلة جامع الحسين" },

            { gov: "حلب", name: "عيادة نسائية - الزبدية", lat: 37.080320, lng: 36.111510, desc: "الزبدية نزلة فرن الزبدية جانب مستوصف الصحة" },
            { gov: "حلب", name: "مركز تل حديا", lat: 36.563060, lng: 35.594150, desc: "ل حديا شارع المستوصف (البريد) -مفرق الصهريج" },
            { gov: "حلب", name: "مركز الشيخ سعيد", lat: 37.091730, lng: 36.095620, desc: "شارع الشيخ سعيد الرئيسي -جانب مخدة مياه الشيخ سعيد مباشرة امام مطعم طيبة" },
            { gov: "حلب", name: "مركز الجبول", lat: 37.301200, lng: 36.050800, desc: "مفرق السفيرة -شارع الروابي" },
            { gov: "حلب", name: "مركز دعم وتمكين المرأة - حلب الرازي", lat: 36.206846, lng: 37.136878, desc: "ريف حلب الجنوبي - الطريق الواصل الى ناحية تل الضمان - قرية بلاس جانب المخبز الآلي سابقا" },

            { gov: "حمص", name: "عيادة نسائية- الخالدية", lat: 34.443000, lng: 36.430300, desc: "الخالدية شارع الشوادر" },
            { gov: "حمص", name: "عيادة نسائية- الوعر", lat: 34.441400, lng: 36.395800, desc: "الوعر قرب القصر العدلي طلعة راكان" },
            { gov: "حمص", name: "عيادة نسائية - تدمر", lat: 34.332200, lng: 38.163300, desc: "تدمر الحي الأوسط" },
            { gov: "حمص", name: "عيادة نسائية و مخبر - دير بعلبة", lat: 34.454500, lng: 36.444000, desc: "دير بعلبة مركز الصحي دير بعلبة الشمالي/" },
            { gov: "حمص", name: "مشفى دار السلام", lat: 34.435900, lng: 36.422600, desc: "جورة الشياح خلف مديرية البريد المقابلة لنادي الضباط سابقا" },
            { gov: "حمص", name: "المستودع", lat: 34.442200, lng: 36.425600, desc: "الخالدية شارع ابن النديم/" },
            { gov: "حمص", name: "مركز دعم وتمكين المرأة - الوعر", lat: 34.743551, lng: 36.718541, desc: "حمص، الخالدية، خلف مدرسة زنوبيا، دخلة شارع ابن الخطيب، جانب منشرة حاكمي ." },

            { gov: "حماة", name: "عيادة نسائية - الضاهرية", lat: 35.162189, lng: 36.726521, desc: "الضاهرية الحي الغربي جانب المقبرة القديمة" },
            { gov: "حماة", name: "عيادة نسائية - الجلمة", lat: 35.191600, lng: 36.291200, desc: "الجلمة - مقابل مدرسة الجلمة الجنوبية" },
            { gov: "حماة", name: "مركز دعم وتمكين المرأة- حماة", lat: 35.135940, lng: 36.762326, desc: "الشرقية - الحاضر - عند جامع المهنا" },

            { gov: "اللاذقية", name: "عيادة نسائية- جبلة", lat: 35.363081, lng: 35.928326, desc: "اللاذقية،جبلة،جنوب الملعب،جانب صيدلية فاتن عبدالله" },
            { gov: "اللاذقية", name: "عيادة نسائية- الرمل الشمالي", lat: 35.533779, lng: 35.780463, desc: "الرمل الشمالي - حي الجمهورية رقم 1- جادة الولاء - المنطقة الخامسة" },
            { gov: "اللاذقية", name: "مركز دعم وتمكين المرأة - اللاذقية", lat: 35.532978, lng: 35.779390, desc: "الرمل الشمالي - مقابل روضة براعم البعث - بعد المخفر" },

            { gov: "طرطوس", name: "عيادة نسائية - دوير الشيخ سعد", lat: 34.919121, lng: 35.920575, desc: "فوق روضة الصبا" },
            { gov: "طرطوس", name: "مركز دعم وتمكين المرأة- طرطوس", lat: 34.921483, lng: 35.922345, desc: "شمال سيراميك زنوبيا مقابل الفرن" },

            { gov: "درعا", name: "عيادة نسائية - الكاشف", lat: 32.632833, lng: 36.109727, desc: "درعا حي الكاشف - العيادات الشاملة" },
            { gov: "درعا", name: "مركز دعم وتمكين المرأة - درعا", lat: 32.627977, lng: 36.106835, desc: "حي السبيل - شمال مدرسة الاموية" },

            { gov: "السويداء", name: "عيادة نسائية- القصور", lat: 32.702561, lng: 36.577824, desc: "طريق المشفى المشفى الوطني بمركز المدينة" },
            { gov: "السويداء", name: "عيادة نسائية - الأمل", lat: 32.712086, lng: 36.569440, desc: "غرب ساحة تشرين مقابل شركة سيرياتيل" },
            { gov: "السويداء", name: "مركز دعم وتمكين المرأة - السويداء", lat: 32.712300, lng: 36.569293, desc: "مركز مساحة آمنة للمرأة - السويداء" },

            { gov: "القنيطرة", name: "عيادة نسائية - خان أرنبة", lat: 33.179961, lng: 35.893282, desc: "عيادة خان ارنبة شارع مدينة السلام مقابل مقبرة خان ارنبة مركز الخان الصحي" },

            { gov: "دير الزور", name: "عيادة نسائية - بعاجين", lat: 35.337830, lng: 40.132141, desc: "دير الزور - بعاجين - مقابل حديقة النصارى - جانب مدرسة الاعداد الحزبي" },
            { gov: "دير الزور", name: "عيادة نسائية - الميادين", lat: 35.019259, lng: 40.453805, desc: "دير الزور - الميادين - الشارع مقابل المحكمة - جنب جامع الروضة" },
            { gov: "دير الزور", name: "مركز دعم وتمكين المرأة - دير الزور", lat: 35.337830, lng: 40.132141, desc: "دير الزور - بعاجين - مقابل حديقة النصارى - جانب مدرسة الاعداد الحزبي" }
        ];

        const markersLayer = L.layerGroup().addTo(map);
        const listContainer = document.getElementById('centers-list');
        const govSelect = document.getElementById('gov-select');
        const searchInput = document.getElementById('search-input');
        const countBadge = document.getElementById('count-badge');

        const pulseIcon = L.divIcon({
            className: 'custom-pulse-marker',
            iconSize: [16, 16],
            iconAnchor: [8, 8],
            popupAnchor: [0, -10]
        });

        function getBadge(name) {
            if (name.includes("دعم وتمكين")) return "دعم وتمكين المرأة";
            if (name.includes("عيادة")) return "عيادة طبية";
            if (name.includes("مشفى")) return "مشفى";
            return "مركز طبي";
        }

        // الدالة الشاملة للفلترة والعرض والتفاعل
        function updateMapAndList() {
            markersLayer.clearLayers();
            listContainer.innerHTML = '';

            const selectedGov = govSelect.value;
            const query = searchInput.value.trim().toLowerCase();

            // تطبيق الفلترة المزدوجة (حسب المحافظة وحسب النص المكتوب في البحث)
            const filtered = centers.filter(c => {
                const matchGov = (selectedGov === 'all' || c.gov === selectedGov);
                const matchSearch = (c.name.toLowerCase().includes(query) || c.desc.toLowerCase().includes(query) || c.gov.toLowerCase().includes(query));
                return matchGov && matchSearch;
            });

            countBadge.innerText = filtered.length + ' مركز';
            const bounds = [];

            filtered.forEach((c, index) => {
                // رسم الدبوس على الخريطة
                const marker = L.marker([c.lat, c.lng], { icon: pulseIcon })
                    .bindPopup(`<h3>${c.name}</h3><div class="popup-gov">${c.gov}</div><p>${c.desc}</p>`)
                    .addTo(markersLayer);

                bounds.push([c.lat, c.lng]);

                // بناء عنصر القائمة الجانبية بتأثير الظهور التدريجي
                const item = document.createElement('div');
                item.className = 'center-item';
                item.style.animationDelay = (index * 0.04) + 's';
                item.innerHTML = `
                    <span class="badge">${getBadge(c.name)}</span>
                    <h4>${c.name}</h4>
                    <p><i class="fa-solid fa-location-dot"></i> ${c.gov} - ${c.desc}</p>
                `;

                // التفاعل عند النقر: إضاءة الكرت، تحليق الكاميرا للخريطة، وفتح الـ Popup
                item.addEventListener('click', () => {
                    document.querySelectorAll('.center-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');

                    map.flyTo([c.lat, c.lng], 14, {
                        animate: true,
                        duration: 1.2
                    });
                    marker.openPopup();
                });

                listContainer.appendChild(item);
            });

            // تحريك الكاميرا بذكاء لتشمل النتائج الظاهرة
            if (bounds.length === 1) {
                map.setView(bounds[0], 14);
            } else if (bounds.length > 1) {
                map.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
            } else if (bounds.length === 0) {
                map.setView([35.151347, 39.056396], 7);
            }
        }

        // الأحداث التفاعلية
        govSelect.addEventListener('change', updateMapAndList);
        searchInput.addEventListener('input', updateMapAndList);

        // التشغيل الأولي وتحديث المقاسات
        updateMapAndList();
        setTimeout(() => map.invalidateSize(), 250);
    </script>

</body>
</html>
