<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخريطة التفاعلية - جمعية تنظيم الأسرة السورية</title>

<!-- استدعاء خط Cairo الاحترافي -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- استدعاء أيقونات FontAwesome الاحترافية -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- استدعاء مكتبة Leaflet CSS الخاصة بالخريطة -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
:root {
    --purple: #25005c;
    --orange: #f6511d;
    --card-text: #111111;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Cairo', sans-serif;
    background: #11002c;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    animation: fadeIn 0.8s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* الشريط العلوي */
.header {
    background: var(--purple);
    color: white;
    padding: 15px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    z-index: 10;
}

.header h1 {
    font-size: 20px;
    font-weight: 800;
}

.back-btn {
    background: var(--orange);
    color: white;
    padding: 8px 18px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.3s ease, background 0.3s ease;
}

.back-btn:hover {
    transform: scale(1.05);
    background: #e04515;
}

/* حاوية الصفحة والجانبية */
.main-container {
    display: flex;
    flex: 1;
    position: relative;
    height: calc(100vh - 70px);
}

/* قائمة جانبية لعرض المراكز مع حركات */
.sidebar {
    width: 320px;
    background: rgba(17, 0, 44, 0.95);
    backdrop-filter: blur(10px);
    border-left: 1px solid rgba(255, 255, 255, 0.1);
    padding: 20px;
    overflow-y: auto;
    z-index: 5;
    color: white;
}

.sidebar h2 {
    font-size: 18px;
    margin-bottom: 15px;
    color: var(--orange);
    border-bottom: 2px solid rgba(255,255,255,0.1);
    padding-bottom: 8px;
}

.center-item {
    background: rgba(255, 255, 255, 0.08);
    padding: 12px 15px;
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid transparent;
}

.center-item:hover {
    background: rgba(246, 81, 29, 0.2);
    border-color: var(--orange);
    transform: translateX(-5px);
}

.center-item h4 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 3px;
}

.center-item p {
    font-size: 12px;
    opacity: 0.8;
}

/* حاوية الخريطة */
#map {
    flex: 1;
    height: 100%;
    z-index: 1;
}

/* تأثير نبض الدبابيس (Pulse Effect) */
@keyframes pulse {
    0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(246, 81, 29, 0.7);
    }
    70% {
        transform: scale(1);
        box-shadow: 0 0 0 15px rgba(246, 81, 29, 0);
    }
    100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(246, 81, 29, 0);
    }
}

.custom-pulse-marker {
    background: var(--orange);
    border: 3px solid #ffffff;
    border-radius: 50%;
    animation: pulse 2s infinite;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

/* تخصيص النافذة المنبثقة Popup */
.leaflet-popup-content-wrapper {
    font-family: 'Cairo', sans-serif;
    border-radius: 16px;
    padding: 5px;
    text-align: right;
    direction: rtl;
}

.leaflet-popup-content h3 {
    color: var(--purple);
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 5px;
}

.leaflet-popup-content p {
    color: #555;
    font-size: 13px;
    font-weight: 600;
    margin: 0;
}

/* استجابة الشاشات الصغيرة */
@media (max-width: 768px) {
    .main-container {
        flex-direction: column-reverse;
    }
    .sidebar {
        width: 100%;
        max-height: 180px;
    }
}
</style>
</head>

<body>

    <div class="header">
        <h1>الخريطة التفاعلية لمراكز جمعية تنظيم الأسرة السورية</h1>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> الرئيسية</a>
    </div>

    <div class="main-container">
        <!-- قائمة المراكز الجانبية التفاعلية -->
        <div class="sidebar">
            <h2>مراكز الفروع الطبية</h2>
            <div id="centers-list"></div>
        </div>

        <!-- عنصر الخريطة -->
        <div id="map"></div>
    </div>

    <!-- استدعاء مكتبة Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // إعداد الخريطة وتمركزها على سورية
        const map = L.map('map').setView([35.151347, 39.056396], 7);

        // إضافة طبقة خريطة نظيفة
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // قائمة المراكز الطبية وإحداثياتها
        const centers = [
            { id: 1, name: "الإدارة العامة - دمشق", lat: 33.5138, lng: 36.2765, desc: "دمشق - أبو رمانة - جانب نقابة الأطباء" },
            { id: 2, name: "مركز دمشق (المجتهد / الصناعة)", lat: 33.5024, lng: 36.3088, desc: "عيادات ونقاط طبية ثابتة" },
            { id: 3, name: "فرع حلب", lat: 36.2021, lng: 37.1343, desc: "عيادات وفرق طبية" },
            { id: 4, name: "فرع حمص", lat: 34.7324, lng: 36.7137, desc: "الخالدية - الوعر ونقاط طبية" },
            { id: 5, name: "فرع حماة", lat: 35.1314, lng: 36.7578, desc: "مركز شباب حماة والعيادات المرتبطة" },
            { id: 6, name: "فرع اللاذقية", lat: 35.5316, lng: 35.7915, desc: "مركز الرمل الشمالي وعيادة جبلة" },
            { id: 7, name: "فرع درعا", lat: 32.6180, lng: 36.1058, desc: "خدمات صحية وإنجابية" },
            { id: 8, name: "فرع دير الزور", lat: 35.3359, lng: 40.1448, desc: "عيادة الميادين والنقاط الطبية" }
        ];

        const markers = {};
        const listContainer = document.getElementById('centers-list');

        // تصميم أيقونة النبض المخصصة
        const pulseIcon = L.divIcon({
            className: 'custom-pulse-marker',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });

        // إضافة المراكز إلى الخريطة والقائمة الجانبية
        centers.forEach(center => {
            // إنشاء الدبوس على الخريطة
            const marker = L.marker([center.lat, center.lng], { icon: pulseIcon }).addTo(map);
            marker.bindPopup(`<h3>${center.name}</h3><p>${center.desc}</p>`);
            markers[center.id] = marker;

            // بناء القائمة الجانبية التفاعلية
            const item = document.createElement('div');
            item.className = 'center-item';
            item.innerHTML = `<h4>${center.name}</h4><p>${center.desc}</p>`;
            
            // حركة الطيران عند النقر على المركز في القائمة
            item.addEventListener('click', () => {
                map.flyTo([center.lat, center.lng], 13, {
                    animate: true,
                    duration: 1.5 // سرعة وسلاسة حركة الكاميرا
                });
                marker.openPopup();
            });

            listContainer.appendChild(item);
        });
    </script>

</body>
</html>
