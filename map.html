<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخريطة التفاعلية - جمعية تنظيم الأسرة السورية</title>

<!-- أيقونة التبويب -->
<link rel="icon" type="image/jpeg" href="final%20logo.jpg">

<!-- استدعاء خط Cairo الاحترافي -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- استدعاء أيقونات FontAwesome الاحترافية -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- استدعاء مكتبة Leaflet CSS الخاصة بالخريطة -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
:root {
    --purple: #25005c;
    --orange: #f6511d;
    --card-text: #111111;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Cairo', sans-serif;
    background: #11002c;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    animation: fadeIn 0.8s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* الشريط العلوي */
.header {
    background: var(--purple);
    color: white;
    padding: 15px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    z-index: 10;
}

.header h1 {
    font-size: 20px;
    font-weight: 800;
}

.back-btn {
    background: var(--orange);
    color: white;
    padding: 8px 18px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.3s ease, background 0.3s ease;
}

.back-btn:hover {
    transform: scale(1.05);
    background: #e04515;
}

/* حاوية الصفحة والجانبية */
.main-container {
    display: flex;
    flex: 1;
    position: relative;
    height: calc(100vh - 70px);
}

/* قائمة جانبية لعرض المراكز مع حركات */
.sidebar {
    width: 350px;
    background: rgba(17, 0, 44, 0.95);
    backdrop-filter: blur(10px);
    border-left: 1px solid rgba(255, 255, 255, 0.1);
    padding: 20px;
    overflow-y: auto;
    z-index: 5;
    color: white;
}

.sidebar h2 {
    font-size: 18px;
    margin-bottom: 15px;
    color: var(--orange);
    border-bottom: 2px solid rgba(255,255,255,0.1);
    padding-bottom: 8px;
}

.center-item {
    background: rgba(255, 255, 255, 0.08);
    padding: 12px 15px;
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid transparent;
}

.center-item:hover {
    background: rgba(246, 81, 29, 0.2);
    border-color: var(--orange);
    transform: translateX(-5px);
}

.center-item .badge {
    display: inline-block;
    background: var(--orange);
    color: white;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 6px;
    margin-bottom: 5px;
    font-weight: 700;
}

.center-item h4 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 3px;
}

.center-item p {
    font-size: 11px;
    opacity: 0.8;
}

/* حاوية الخريطة */
#map {
    flex: 1;
    height: 100%;
    z-index: 1;
}

/* تأثير نبض الدبابيس (Pulse Effect) */
@keyframes pulse {
    0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(246, 81, 29, 0.7);
    }
    70% {
        transform: scale(1);
        box-shadow: 0 0 0 15px rgba(246, 81, 29, 0);
    }
    100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(246, 81, 29, 0);
    }
}

.custom-pulse-marker {
    background: var(--orange);
    border: 3px solid #ffffff;
    border-radius: 50%;
    animation: pulse 2s infinite;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

/* تخصيص النافذة المنبثقة Popup */
.leaflet-popup-content-wrapper {
    font-family: 'Cairo', sans-serif;
    border-radius: 16px;
    padding: 5px;
    text-align: right;
    direction: rtl;
}

.leaflet-popup-content h3 {
    color: var(--purple);
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 4px;
}

.leaflet-popup-content .popup-gov {
    color: var(--orange);
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 4px;
}

.leaflet-popup-content p {
    color: #555;
    font-size: 12px;
    font-weight: 600;
    margin: 0;
}

/* استجابة الشاشات الصغيرة */
@media (max-width: 768px) {
    .main-container {
        flex-direction: column-reverse;
    }
    .sidebar {
        width: 100%;
        max-height: 200px;
    }
}
</style>
</head>

<body>

    <div class="header">
        <h1>الخريطة التفاعلية لمراكز جمعية تنظيم الأسرة السورية</h1>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> الرئيسية</a>
    </div>

    <div class="main-container">
        <!-- قائمة المراكز الجانبية التفاعلية -->
        <div class="sidebar">
            <h2>قائمة المراكز والعيادات</h2>
            <div id="centers-list"></div>
        </div>

        <!-- عنصر الخريطة -->
        <div id="map"></div>
    </div>

    <!-- استدعاء مكتبة Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // إعداد الخريطة وتمركزها على سورية
        const map = L.map('map').setView([35.151347, 39.056396], 7);

        // إضافة طبقة خريطة نظيفة
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // قائمة كافة المراكز والعيادات من الجدول المعتمد
        const centers = [
            // دمشق
            { gov: "دمشق", name: "عيادة نسائية - الحلَبوني", lat: 33.30393, lng: 36.17379, desc: "الحلبوني - جادة ابن سينا - جانب دار ابن كثير - بناء الفرخ ط1" },
            { gov: "دمشق", name: "مركز صحة القدم", lat: 33.47208567, lng: 36.28708546, desc: "لقدم جانب بلدية القدم -بالقرب من مخفر الشرطه .. شارع مكتب السفريات" },
            { gov: "دمشق", name: "مركز دعم وتمكين المرأة - مساكن برزة", lat: 33.30127, lng: 36.18341, desc: "مساكن برزة- دوار الطاهي- مكتبة السلام" },
            { gov: "دمشق", name: "عيادة نسائية - حفير تحتا", lat: 33.64979365, lng: 36.43783148, desc: "حفير التحتا جنب جامع الفاروق" },
            
            // ريف دمشق
            { gov: "ريف دمشق", name: "عيادة نسائية - جرمانا", lat: 33.48431748, lng: 36.34354682, desc: "عيادة جرمانا امتداد البلدية القديمة خلف الملعب البلدي دخله صيدلية أميرة كركوش" },
            { gov: "ريف دمشق", name: "عيادة نسائية - يبرود", lat: 33.97069246, lng: 36.65800064, desc: "بيرود شارع الماركات بناء عساف بالقرب من مركز الحولات الهرم" },
            { gov: "ريف دمشق", name: "عيادة نسائية - دوما", lat: 33.56961953, lng: 36.4090191, desc: "قبو جامع ابراهيم الخليل" },
            { gov: "ريف دمشق", name: "وحدة حماية الأسرة - قدسيا", lat: 33.54276297, lng: 36.19646788, desc: "ساحة تروي، ناحية مركز قدسيا" },
            { gov: "ريف دمشق", name: "مركز دعم وتمكين المرأة - قدسيا", lat: 33.551874, lng: 36.212537, desc: "ساحة العمري - اتجاه يسار - موقف الخياطين - جانب معجنات الخضراء" },
            { gov: "ريف دمشq", name: "مركز دعم وتمكين المرأة - دوما", lat: 33.568566, lng: 36.406974, desc: "شارع الجلاء- جانب إبراهيم الخليل- مستوصف الجامع." },
            { gov: "ريف دمشق", name: "مركز دعم وتمكين المرأة - كفر بطنا", lat: 33.3069, lng: 36.2238, desc: "كفر بطنا - بعد دوار النور ب50 متر" },
            { gov: "ريف دمشق", name: "مركز دعم وتمكين المرأة - اشرفية صحنايا", lat: 33.424555, lng: 36.222021, desc: "صحنايا البلد - اخر السرافيس - مقابل ماركت القصار" },
            { gov: "ريف دمشق", name: "مركز دعم وتمكين المرأة - يبرود", lat: 33.93525, lng: 36.66544, desc: "اول الكورنيش الشمالي - نزلة جامع الحسين" },

            // حلب
            { gov: "حلب", name: "عيادة نسائية - الزبدية", lat: 37.08032, lng: 36.11151, desc: "الزبدية نزلة فرن الزبدية جانب مستوصف الصحة" },
            { gov: "حلب", name: "مركز تل حديا", lat: 36.56306, lng: 35.59415, desc: "ل حديا شارع المستوصف (البريد) -مفرق الصهريج" },
            { gov: "حلب", name: "مركز الشيخ سعيد", lat: 37.09173, lng: 36.09562, desc: "شارع الشيخ سعيد الرئيسي -جانب مخدة مياه الشيخ سعيد مباشرة امام مطعم طيبة" },
            { gov: "حلب", name: "مركز الجبول", lat: 37.3012, lng: 36.0508, desc: "مفرق السفيرة -شارع الروابي" },
            { gov: "حلب", name: "مركز دعم وتمكين المرأة - حلب الرازي", lat: 36.206846, lng: 37.136878, desc: "ريف حلب الجنوبي - الطريق الواصل الى ناحية تل الضمان - قرية بلاس جانب المخبز الآلي سابقا" },

            // حمص
            { gov: "حمص", name: "عيادة نسائية- الخالدية", lat: 34.4430.5, lng: 36.4303.6, desc: "الخالدية شارع الشوادر" },
            { gov: "حمص", name: "عيادة نسائية- الوعر", lat: 34.4414, lng: 36.3958.9, desc: "الوعر قرب القصر العدلي طلعة راكان" },
            { gov: "حمص", name: "عيادة نسائية - تدمر", lat: 34.3322.1, lng: 38.1633.6, desc: "تدمر الحي الأوسط" },
            { gov: "حمص", name: "عيادة نسائية و مخبر - دير بعلبة", lat: 34.4545.2, lng: 36.4440, desc: "دير بعلبة مركز الصحي دير بعلبة الشمالي/" },
            { gov: "حمص", name: "مشفى دار السلام", lat: 34.4359.5, lng: 36.4226.2, desc: "جورة الشياح خلف مديرية البريد المقابلة لنادي الضباط سابقا" },
            { gov: "حمص", name: "المستودع", lat: 34.4422.5, lng: 36.4256.1, desc: "الخالدية شارع ابن النديم/" },
            { gov: "حمص", name: "مركز دعم وتمكين المرأة - الوعر", lat: 34.74355118, lng: 36.71854192, desc: "حمص، الخالدية، خلف مدرسة زنوبيا، دخلة شارع ابن الخطيب، جانب منشرة حاكمي ." },

            // حماة
            { gov: "حماة", name: "عيادة نسائية - الضاهرية", lat: 35.16218988, lng: 36.72652108, desc: "الضاهرية الحي الغربي جانب المقبرة القديمة" },
            { gov: "حماة", name: "عيادة نسائية - الجلمة", lat: 35.1916.8, lng: 36.2912.8, desc: "الجلمة - مقابل مدرسة الجلمة الجنوبية" },
            { gov: "حماة", name: "مركز دعم وتمكين المرأة- حماة", lat: 35.13594, lng: 36.762326, desc: "الشرقية - الحاضر - عند جامع المهنا" },

            // اللاذقية
            { gov: "اللاذقية", name: "عيادة نسائية- جبلة", lat: 35.36308139, lng: 35.92832648, desc: "اللاذقية،جبلة،جنوب الملعب،جانب صيدلية فاتن عبدالله" },
            { gov: "اللاذقية", name: "عيادة نسائية- الرمل الشمالي", lat: 35.5337798, lng: 35.7804638, desc: "الرمل الشمالي - حي الجمهورية رقم 1- جادة الولاء - المنطقة الخامسة" },
            { gov: "اللاذقية", name: "مركز دعم وتمكين المرأة - اللاذقية", lat: 35.532978, lng: 35.77939, desc: "الرمل الشمالي - مقابل روضة براعم البعث - بعد المخفر" },

            // طرطوس
            { gov: "طرطوس", name: "عيادة نسائية - دوير الشيخ سعد", lat: 34.91912194, lng: 35.92057563, desc: "فوق روضة الصبا" },
            { gov: "طرطوس", name: "مركز دعم وتمكين المرأة- طرطوس", lat: 34.92148391, lng: 35.92234593, desc: "شمال سيراميك زنوبيا مقابل الفرن" },

            // درعا
            { gov: "درعا", name: "عيادة نسائية - الكاشف", lat: 32.6328333, lng: 36.1097276, desc: "درعا حي الكاشف - العيادات الشاملة" },
            { gov: "درعا", name: "مركز دعم وتمكين المرأة - درعا", lat: 32.627977, lng: 36.106835, desc: "حي السبيل - شمال مدرسة الاموية" },

            // السويداء
            { gov: "السويداء", name: "عيادة نسائية- القصور", lat: 32.70256175, lng: 36.57782448, desc: "طريق المشفى المشفى الوطني بمركز المدينة" },
            { gov: "السويداء", name: "عيادة نسائية - الأمل", lat: 32.71208691, lng: 36.56944063, desc: "غرب ساحة تشرين مقابل شركة سيرياتيل" },
            { gov: "السويداء", name: "مركز دعم وتمكين المرأة - السويداء", lat: 32.71230027, lng: 36.56929381, desc: "مركز مساحة آمنة للمرأة - السويداء" },

            // القنيطرة
            { gov: "القنيطرة", name: "عيادة نسائية - خان أرنبة", lat: 33.17996182, lng: 35.89328288, desc: "عيادة خان ارنبة شارع مدينة السلام مقابل مقبرة خان ارنبة مركز الخان الصحي" },

            // دير الزور
            { gov: "دير الزور", name: "عيادة نسائية - بعاجين", lat: 35.33783016, lng: 40.13214137, desc: "دير الزور - بعاجين - مقابل حديقة النصارى - جانب مدرسة الاعداد الحزبي" },
            { gov: "دير الزور", name: "عيادة نسائية - الميادين", lat: 35.019259, lng: 40.453805, desc: "دير الزور - الميادين - الشارع مقابل المحكمة - جنب جامع الروضة" },
            { gov: "دير الزور", name: "مركز دعم وتمكين المرأة - دير الزور", lat: 35.33783016, lng: 40.13214137, desc: "دير الزور - بعاجين - مقابل حديقة النصارى - جانب مدرسة الاعداد الحزبي" }
        ];

        const markers = {};
        const listContainer = document.getElementById('centers-list');

        // تصميم أيقونة النبض المخصصة
        const pulseIcon = L.divIcon({
            className: 'custom-pulse-marker',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });

        // إضافة المراكز إلى الخريطة والقائمة الجانبية
        centers.forEach((center, index) => {
            // التحقق من صحة الإحداثيات قبل الإضافة
            if (!isNaN(center.lat) && !isNaN(center.lng)) {
                const marker = L.marker([center.lat, center.lng], { icon: pulseIcon }).addTo(map);
                marker.bindPopup(`<div class="popup-gov">${center.gov}</div><h3>${center.name}</h3><p>${center.desc}</p>`);
                markers[index] = marker;

                // بناء القائمة الجانبية التفاعلية
                const item = document.createElement('div');
                item.className = 'center-item';
                item.innerHTML = `<span class="badge">${center.gov}</span><h4>${center.name}</h4><p>${center.desc}</p>`;
                
                // حركة الطيران عند النقر على المركز في القائمة
                item.addEventListener('click', () => {
                    map.flyTo([center.lat, center.lng], 13, {
                        animate: true,
                        duration: 1.5
                    });
                    marker.openPopup();
                });

                listContainer.appendChild(item);
            }
        });
    </script>

</body>
</html>
