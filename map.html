<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخريطة التفاعلية - جمعية تنظيم الأسرة السورية</title>

<!-- أيقونة التبويب -->
<link rel="icon" type="image/jpeg" href="final%20logo.jpg">

<!-- استدعاء خط Cairo الاحترافي -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- استدعاء أيقونات FontAwesome الاحترافية -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- استدعاء مكتبة Leaflet CSS الخاصة بالخريطة -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
:root {
    --purple: #25005c;
    --orange: #f6511d;
    --card-text: #111111;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Cairo', sans-serif;
    background: #11002c;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* الشريط العلوي */
.header {
    background: var(--purple);
    color: white;
    padding: 10px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    z-index: 10;
    height: 60px;
    flex-shrink: 0;
}

.header h1 {
    font-size: 18px;
    font-weight: 800;
}

.back-btn {
    background: var(--orange);
    color: white;
    padding: 6px 16px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.3s ease, background 0.3s ease;
}

.back-btn:hover {
    transform: scale(1.05);
    background: #e04515;
}

/* حاوية الصفحة والجانبية */
.main-container {
    display: flex;
    flex-direction: row;
    width: 100%;
    height: calc(100vh - 60px);
    position: relative;
}

/* قائمة جانبية لعرض المراكز مع فلترة المحافظات */
.sidebar {
    width: 360px;
    background: rgba(17, 0, 44, 0.98);
    border-left: 1px solid rgba(255, 255, 255, 0.1);
    padding: 15px;
    z-index: 10;
    color: white;
    height: 100%;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}

.sidebar h2 {
    font-size: 16px;
    margin-bottom: 10px;
    color: var(--orange);
    border-bottom: 2px solid rgba(255,255,255,0.1);
    padding-bottom: 6px;
}

/* تصميم القائمة المنسدلة للفلترة */
.filter-container {
    margin-bottom: 12px;
}

.filter-container label {
    display: block;
    font-size: 12px;
    margin-bottom: 4px;
    color: #ddd;
    font-weight: 600;
}

.filter-select {
    width: 100%;
    padding: 8px 10px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    color: white;
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    outline: none;
    cursor: pointer;
}

.filter-select option {
    background: #25005c;
    color: white;
}

.centers-list-container {
    flex: 1;
    overflow-y: auto;
    padding-left: 5px;
}

.center-item {
    background: rgba(255, 255, 255, 0.08);
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    border: 1px solid transparent;
}

.center-item:hover {
    background: rgba(246, 81, 29, 0.2);
    border-color: var(--orange);
}

.center-item .badge {
    display: inline-block;
    background: var(--orange);
    color: white;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 4px;
    margin-bottom: 4px;
    font-weight: 700;
}

.center-item h4 {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 2px;
    color: #ffffff;
}

.center-item p {
    font-size: 11px;
    opacity: 0.85;
    color: #dddddd;
}

/* حاوية الخريطة (تم ضبطها لتملأ المساحة الباقية تماماً) */
#map {
    flex: 1;
    height: 100%;
    width: 100%;
    z-index: 1;
}

/* تأثير نبض الدبابيس */
@keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(246, 81, 29, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(246, 81, 29, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(246, 81, 29, 0); }
}

.custom-pulse-marker {
    background: var(--orange);
    border: 2px solid #ffffff;
    border-radius: 50%;
    animation: pulse 2s infinite;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

/* تخصيص النافذة المنبثقة Popup */
.leaflet-popup-content-wrapper {
    font-family: 'Cairo', sans-serif;
    border-radius: 12px;
    padding: 5px;
    text-align: right;
    direction: rtl;
}

.leaflet-popup-content h3 {
    color: var(--purple);
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 3px;
}

.leaflet-popup-content .popup-gov {
    color: var(--orange);
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 3px;
}

.leaflet-popup-content p {
    color: #555;
    font-size: 11px;
    margin: 0;
}

/* استجابة الشاشات الصغيرة */
@media (max-width: 768px) {
    .main-container {
        flex-direction: column-reverse;
    }
    .sidebar {
        width: 100%;
        height: 250px;
    }
    #map {
        height: calc(100vh - 310px);
    }
}
</style>
</head>
