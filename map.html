<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخريطة التفاعلية - جمعية تنظيم الأسرة السورية</title>

<!-- أيقونة التبويب -->
<link rel="icon" type="image/jpeg" href="final%20logo.jpg">

<!-- خط Cairo -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<!-- تجميع الدبابيس (Clusters) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />

<style>
:root {
    --purple: #25005c;
    --orange: #f6511d;
    --support: #a855f7;
    --other: #14b8a6;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Cairo', sans-serif;
    background: #11002c;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* الشريط العلوي */
.header {
    background: var(--purple);
    color: white;
    padding: 10px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    z-index: 1000;
    height: 60px;
    flex-shrink: 0;
}
.header h1 { font-size: 18px; font-weight: 800; }

.back-btn {
    background: var(--orange);
    color: white;
    padding: 6px 16px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.3s ease, background 0.3s ease;
}
.back-btn:hover { transform: scale(1.05); background: #e04515; }

.main-container {
    display: flex;
    flex-direction: row;
    width: 100%;
    height: calc(100vh - 60px);
    position: relative;
}

/* القائمة الجانبية */
.sidebar {
    width: 370px;
    background: rgba(17, 0, 44, 0.98);
    border-left: 1px solid rgba(255, 255, 255, 0.1);
    padding: 15px;
    z-index: 10;
    color: white;
    height: 100%;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}

.sidebar h2 {
    font-size: 16px;
    margin-bottom: 10px;
    color: var(--orange);
    border-bottom: 2px solid rgba(255,255,255,0.1);
    padding-bottom: 6px;
}

/* حقل البحث */
.search-box { position: relative; margin-bottom: 10px; }
.search-box i {
    position: absolute; right: 12px; top: 50%;
    transform: translateY(-50%); color: #bbb; font-size: 13px;
}
.search-input {
    width: 100%;
    padding: 9px 36px 9px 32px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    color: white;
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color .3s, background .3s;
}
.search-input::placeholder { color: #bbb; }
.search-input:focus { border-color: var(--orange); background: rgba(255,255,255,0.18); }
.search-clear {
    position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: #ddd; cursor: pointer;
    font-size: 14px; display: none;
}

.filter-container { margin-bottom: 10px; }
.filter-container label {
    display: block; font-size: 12px; margin-bottom: 4px;
    color: #ddd; font-weight: 600;
}
.filter-select {
    width: 100%; padding: 8px 10px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; color: white;
    font-family: 'Cairo', sans-serif; font-size: 13px;
    outline: none; cursor: pointer;
}
.filter-select option { background: #25005c; color: white; }

/* أزرار نوع المركز */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip {
    font-family: 'Cairo', sans-serif;
    font-size: 11px; font-weight: 700;
    padding: 4px 10px; border-radius: 20px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #eee; cursor: pointer;
    transition: all .25s ease;
}
.chip:hover { background: rgba(246,81,29,0.25); }
.chip.active { background: var(--orange); border-color: var(--orange); color: #fff; }

/* شريط العدد + زر أقرب مركز */
.toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; gap: 8px;
}
.count-label { font-size: 12px; color: #ddd; font-weight: 600; }
.count-label b { color: var(--orange); font-size: 15px; }
.locate-btn {
    font-family: 'Cairo', sans-serif;
    font-size: 11px; font-weight: 700;
    background: var(--orange); color: white;
    border: none; border-radius: 8px;
    padding: 6px 10px; cursor: pointer;
    transition: transform .25s, background .25s;
    white-space: nowrap;
}
.locate-btn:hover { transform: scale(1.05); background: #e04515; }
.locate-btn.loading i { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* القائمة */
.centers-list-container { flex: 1; overflow-y: auto; padding-left: 5px; }
.centers-list-container::-webkit-scrollbar { width: 6px; }
.centers-list-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 6px; }

.center-item {
    background: rgba(255,255,255,0.08);
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    border: 1px solid transparent;
    animation: slideIn .4s ease both;
}
@keyframes slideIn {
    from { opacity: 0; transform: translateX(18px); }
    to   { opacity: 1; transform: translateX(0); }
}
.center-item:hover, .center-item.active {
    background: rgba(246,81,29,0.2);
    border-color: var(--orange);
    transform: translateX(-3px);
}
.center-item .badge {
    display: inline-block; color: white; font-size: 9px;
    padding: 2px 6px; border-radius: 4px; margin-bottom: 4px; font-weight: 700;
}
.badge.t-clinic  { background: var(--orange); }
.badge.t-support { background: var(--support); }
.badge.t-other   { background: var(--other); }
.center-item h4 { font-size: 13px; font-weight: 700; margin-bottom: 2px; color: #fff; }
.center-item p { font-size: 11px; opacity: 0.85; color: #ddd; }
.center-item .dist { color: #ffd0c2; font-weight: 700; margin-top: 3px; }

.empty-msg {
    text-align: center; color: #ccc; font-size: 13px;
    padding: 30px 10px; opacity: .85;
}

/* الخريطة */
#map { flex: 1; height: 100%; width: 100%; min-height: 300px; z-index: 1; }

/* الدبابيس: الحركة على عنصر داخلي حتى لا نكسر تموضع Leaflet */
.pin-wrap { background: none; border: none; }
.pin {
    display: block; width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
    animation: pulse 2s infinite, dropIn .6s cubic-bezier(.34,1.56,.64,1) both;
    transition: transform .2s;
}
.pin.t-clinic  { background: var(--orange);  --pulse: rgba(246,81,29,0.7); }
.pin.t-support { background: var(--support); --pulse: rgba(168,85,247,0.7); }
.pin.t-other   { background: var(--other);   --pulse: rgba(20,184,166,0.7); }
.pin.hl { animation: bounce .6s ease infinite; border-width: 3px; }

@keyframes pulse {
    0%   { box-shadow: 0 0 0 0 var(--pulse); }
    70%  { box-shadow: 0 0 0 14px rgba(0,0,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
}
@keyframes dropIn {
    from { opacity: 0; transform: translateY(-25px) scale(.4); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes bounce {
    0%,100% { transform: translateY(0) scale(1.35); }
    50%     { transform: translateY(-9px) scale(1.35); }
}

/* دبوس موقعي */
.me-dot {
    display: block; width: 16px; height: 16px; border-radius: 50%;
    background: #2f80ff; border: 3px solid #fff;
    box-shadow: 0 0 0 0 rgba(47,128,255,.7);
    animation: mePulse 1.8s infinite;
}
@keyframes mePulse {
    0% { box-shadow: 0 0 0 0 rgba(47,128,255,.7); }
    70% { box-shadow: 0 0 0 16px rgba(47,128,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(47,128,255,0); }
}

/* دوائر التجميع */
.cluster-icon {
    background: var(--purple);
    border: 3px solid var(--orange);
    color: #fff; font-weight: 800; font-size: 14px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 14px rgba(246,81,29,0.6);
    font-family: 'Cairo', sans-serif;
}

/* النافذة المنبثقة */
.leaflet-popup-content-wrapper {
    font-family: 'Cairo', sans-serif;
    border-radius: 12px; padding: 5px;
    text-align: right; direction: rtl;
}
.leaflet-popup-content h3 { color: var(--purple); font-size: 14px; font-weight: 800; margin-bottom: 3px; }
.leaflet-popup-content .popup-gov { color: var(--orange); font-size: 11px; font-weight: 700; margin-bottom: 3px; }
.leaflet-popup-content p { color: #555; font-size: 11px; margin: 0; }
.popup-actions { display: flex; gap: 6px; margin-top: 8px; }
.popup-btn {
    flex: 1; text-align: center; text-decoration: none;
    font-size: 11px; font-weight: 700; padding: 6px 8px;
    border-radius: 8px; background: var(--orange); color: #fff !important;
    transition: background .25s;
}
.popup-btn:hover { background: #e04515; }
.popup-btn.alt { background: var(--purple); }

/* مفتاح الخريطة */
.legend {
    background: rgba(17,0,44,0.9); color: #fff;
    padding: 8px 12px; border-radius: 10px;
    font-family: 'Cairo', sans-serif; font-size: 11px; line-height: 1.9;
    direction: rtl;
}
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-left: 6px; border: 1.5px solid #fff; }

.reset-btn {
    background: #fff; width: 34px; height: 34px; line-height: 34px;
    text-align: center; display: block; color: var(--purple);
    font-size: 15px; cursor: pointer; text-decoration: none;
}
.reset-btn:hover { background: #f4f4f4; color: var(--orange); }

/* الشاشات الصغيرة */
@media (max-width: 768px) {
    .main-container { flex-direction: column-reverse; }
    .sidebar { width: 100%; height: 300px; }
    #map { height: calc(100vh - 360px); }
    .header h1 { font-size: 14px; }
}
</style>
</head>

<body>

    <div class="header">
        <h1>الخريطة التفاعلية لمراكز جمعية تنظيم الأسرة السورية</h1>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> الرئيسية</a>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <h2>مراكز الفروع الطبية</h2>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search" class="search-input" placeholder="ابحث باسم المركز أو العنوان...">
                <button class="search-clear" id="search-clear" title="مسح">✕</button>
            </div>

            <div class="filter-container">
                <label for="gov-select">اختر المحافظة:</label>
                <select id="gov-select" class="filter-select">
                    <option value="all">🌐 كافة المحافظات (عرض الكل)</option>
                    <option value="دمشق">دمشق</option>
                    <option value="ريف دمشق">ريف دمشق</option>
                    <option value="حلب">حلب</option>
                    <option value="حمص">حمص</option>
                    <option value="حماة">حماة</option>
                    <option value="اللاذقية">اللاذقية</option>
                    <option value="طرطوس">طرطوس</option>
                    <option value="درعا">درعا</option>
                    <option value="السويداء">السويداء</option>
                    <option value="القنيطرة">القنيطرة</option>
                    <option value="دير الزور">دير الزور</option>
                </select>
            </div>

            <div class="chips" id="type-chips">
                <button class="chip active" data-type="all">الكل</button>
                <button class="chip" data-type="clinic">العيادات</button>
                <button class="chip" data-type="support">مراكز دعم وتمكين المرأة</button>
                <button class="chip" data-type="other">أخرى</button>
            </div>

            <div class="toolbar">
                <div class="count-label">عدد النتائج: <b id="count">0</b></div>
                <button class="locate-btn" id="locate-btn"><i class="fa-solid fa-location-crosshairs"></i> أقرب مركز لي</button>
            </div>

            <div class="centers-list-container" id="centers-list"></div>
        </div>

        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script>
        // ===== الخريطة والطبقات =====
        const map = L.map('map', { zoomControl: true }).setView([35.151347, 39.056396], 7);

        const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19, attribution: 'Tiles &copy; Esri'
        });

        const dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19, attribution: '&copy; OpenStreetMap &copy; CARTO'
        });

        L.control.layers({
            'خريطة الشوارع': streets,
            'صور الأقمار الصناعية': satellite,
            'خريطة داكنة': dark
        }, null, { position: 'topleft' }).addTo(map);

            { gov: "دمشق", name: "عيادة نسائية - حفير تحتا", lat: 33.649793, lng: 36.437831, desc: "حفير التحتا جنب جامع الفاروق" },

            { gov: "ريف دمشق", name: "عيادة نسائية - جرمانا", lat: 33.484317, lng: 36.343546, desc: "عيادة جرمانا امتداد البلدية القديمة خلف الملعب البلدي دخله صيدلية أميرة كركوش" },

            { gov: "ريف دمشق", name: "مركز دعم وتمكين المرأة - قدسيا", lat: 33.551874, lng: 36.212537, desc: "ساحة العمري - اتجاه يسار - موقف الخياطين - جانب معجنات الخضراء" },
            { gov: "ريف دمشق", name: "مركز دعم وتمكين المرأة - دوما", lat: 33.568566, lng: 36.406974, desc: "شارع الجلاء- جانب إبراهيم الخليل- مستوصف الجامع." },

            { gov: "اللاذقية", name: "عيادة نسائية- جبلة", lat: 35.363081, lng: 35.928326, desc: "اللاذقية،جبلة،جنوب الملعب،جانب صيدلية فاتن عبدالله" },
            { gov: "اللاذقية", name: "عيادة نسائية- الرمل الشمالي", lat: 35.533779, lng: 35.780463, desc: "الرمل الشمالي - حي الجمهورية رقم 1- جادة الولاء - المنطقة الخامسة" },
            { gov: "اللاذقية", name: "مركز دعم وتمكين المرأة - اللاذقية", lat: 35.532978, lng: 35.779390, desc: "الرمل الشمالي - مقابل روضة براعم البعث - بعد المخفر" },

            { gov: "طرطوس", name: "عيادة نسائية - دوير الشيخ سعد", lat: 34.919121, lng: 35.920575, desc: "فوق روضة الصبا" },
            { gov: "طرطوس", name: "مركز دعم وتمكين المرأة- طرطوس", lat: 34.921483, lng: 35.922345, desc: "شمال سيراميك زنوبيا مقابل الفرن" },

            { gov: "درعا", name: "عيادة نسائية - الكاشف", lat: 32.632833, lng: 36.109727, desc: "درعا حي الكاشف - العيادات الشاملة" },
            { gov: "درعا", name: "مركز دعم وتمكين المرأة - درعا", lat: 32.627977, lng: 36.106835, desc: "حي السبيل - شمال مدرسة الاموية" },

            { gov: "السويداء", name: "عيادة نسائية- القصور", lat: 32.702561, lng: 36.577824, desc: "طريق المشفى المشفى الوطني بمركز المدينة" },
            { gov: "السويداء", name: "عيادة نسائية - الأمل", lat: 32.712086, lng: 36.569440, desc: "غرب ساحة تشرين مقابل شركة سيرياتيل" },
            { gov: "السويداء", name: "مركز دعم وتمكين المرأة - السويداء", lat: 32.712300, lng: 36.569293, desc: "مركز مساحة آمنة للمرأة - السويداء" },

            { gov: "القنيطرة", name: "عيادة نسائية - خان أرنبة", lat: 33.179961, lng: 35.893282, desc: "عيادة خان ارنبة شارع مدينة السلام مقابل مقبرة خان ارنبة مركز الخان الصحي" },

            { gov: "دير الزور", name: "عيادة نسائية - بعاجين", lat: 35.337830, lng: 40.132141, desc: "دير الزور - بعاجين - مقابل حديقة النصارى - جانب مدرسة الاعداد الحزبي" }
            // ⬅️ أضف هنا بقية المراكز (ضع فاصلة بعد السطر السابق ثم المركز الجديد)
        ];

        // ===== أدوات مساعدة =====
        const TYPE_LABELS = { clinic: "عيادة", support: "مركز دعم وتمكين المرأة", other: "مركز / خدمات أخرى" };

        function typeOf(name) {
            if (name.includes("دعم وتمكين")) return "support";
            if (name.includes("عيادة")) return "clinic";
            return "other";
        }

        function esc(s) {
            return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        }

        // تطبيع النص العربي للبحث (حذف التشكيل وتوحيد الألف والهاء والياء)
        function norm(s) {
            return String(s).toLowerCase()
                .replace(/[\u064B-\u0652\u0640]/g, '')
                .replace(/[أإآ]/g, 'ا')
                .replace(/ة/g, 'ه')
                .replace(/ى/g, 'ي');
        }

        function distKm(a, b) {
            const R = 6371, rad = Math.PI / 180;
            const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
            const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*rad) * Math.cos(b.lat*rad) * Math.sin(dLng/2)**2;
            return 2 * R * Math.asin(Math.sqrt(x));
        }

        centers.forEach((c, i) => { c.id = i; c.type = typeOf(c.name); c.search = norm(c.name + ' ' + c.gov + ' ' + c.desc); });

        // ===== طبقة التجميع =====
        const cluster = L.markerClusterGroup({
            showCoverageOnHover: false,
            maxClusterRadius: 45,
            spiderfyOnMaxZoom: true,
            iconCreateFunction: function (cl) {
                const n = cl.getChildCount();
                const size = n < 5 ? 38 : 46;
                return L.divIcon({
                    html: '<div class="cluster-icon" style="width:' + size + 'px;height:' + size + 'px">' + n + '</div>',
                    className: 'pin-wrap',
                    iconSize: [size, size]
                });
            }
        }).addTo(map);

        const state = { gov: 'all', type: 'all', q: '', user: null };
        const markers = {};      // id -> marker
        const listItems = {};    // id -> عنصر القائمة
        let userMarker = null;

        function makeIcon(type) {
            return L.divIcon({
                className: 'pin-wrap',
                html: '<span class="pin t-' + type + '"></span>',
                iconSize: [22, 22],
                iconAnchor: [11, 11],
                popupAnchor: [0, -12]
            });
        }

        function popupHtml(c) {
            const dir = 'https://www.google.com/maps/dir/?api=1&destination=' + c.lat + ',' + c.lng;
            const view = 'https://www.google.com/maps/search/?api=1&query=' + c.lat + ',' + c.lng;
            let extra = '';
            if (state.user) extra = '<p style="margin-top:4px;color:#f6511d;font-weight:700">يبعد عنك ' + distKm(state.user, c).toFixed(1) + ' كم</p>';
            return '<h3>' + esc(c.name) + '</h3>' +
                   '<div class="popup-gov">' + esc(c.gov) + ' · ' + TYPE_LABELS[c.type] + '</div>' +
                   '<p>' + esc(c.desc) + '</p>' + extra +
                   '<div class="popup-actions">' +
                   '<a class="popup-btn" target="_blank" rel="noopener" href="' + dir + '"><i class="fa-solid fa-route"></i> الاتجاهات</a>' +
                   '<a class="popup-btn alt" target="_blank" rel="noopener" href="' + view + '"><i class="fa-solid fa-map-location-dot"></i> Google Maps</a>' +
                   '</div>';
        }

        // إنشاء الدبابيس مرة واحدة
        centers.forEach(c => {
            const m = L.marker([c.lat, c.lng], { icon: makeIcon(c.type), title: c.name });
            m.bindPopup(function () { return popupHtml(c); }, { maxWidth: 270 });
            m.on('popupopen', () => setActive(c.id));
            m.on('popupclose', () => setActive(null));
            m.on('mouseover', () => { const it = listItems[c.id]; if (it) it.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); });
            markers[c.id] = m;
        });

        function setActive(id) {
            Object.keys(listItems).forEach(k => listItems[k].classList.toggle('active', Number(k) === id));
            if (id !== null && listItems[id]) listItems[id].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        function highlightPin(id, on) {
            const m = markers[id];
            if (m && m._icon) {
                const pin = m._icon.querySelector('.pin');
                if (pin) pin.classList.toggle('hl', on);
            }
        }

        function goTo(c) {
            const m = markers[c.id];
            map.flyTo([c.lat, c.lng], 15, { duration: 1.2 });
            map.once('moveend', () => cluster.zoomToShowLayer(m, () => m.openPopup()));
        }

        // ===== الرسم والفلترة =====
        function getFiltered() {
            const q = norm(state.q.trim());
            let list = centers.filter(c =>
                (state.gov === 'all' || c.gov === state.gov) &&
                (state.type === 'all' || c.type === state.type) &&
                (!q || c.search.includes(q))
            );
            if (state.user) {
                list = list.map(c => Object.assign({}, c, { d: distKm(state.user, c) }))
                           .sort((a, b) => a.d - b.d);
            }
            return list;
        }

        function render(fit) {
            const list = getFiltered();
            const listEl = document.getElementById('centers-list');
            listEl.innerHTML = '';
            cluster.clearLayers();
            Object.keys(listItems).forEach(k => delete listItems[k]);

            document.getElementById('count').textContent = list.length;

            if (!list.length) {
                listEl.innerHTML = '<div class="empty-msg"><i class="fa-regular fa-face-frown"></i><br>لا توجد نتائج مطابقة</div>';
                return;
            }

            const layers = [];
            const bounds = [];

            list.forEach((c, i) => {
                layers.push(markers[c.id]);
                bounds.push([c.lat, c.lng]);

                const item = document.createElement('div');
                item.className = 'center-item';
                item.style.animationDelay = Math.min(i * 30, 600) + 'ms';
                item.innerHTML =
                    '<span class="badge t-' + c.type + '">' + TYPE_LABELS[c.type] + '</span>' +
                    '<h4>' + esc(c.name) + '</h4>' +
                    '<p>' + esc(c.gov) + ' - ' + esc(c.desc) + '</p>' +
                    (c.d !== undefined ? '<p class="dist"><i class="fa-solid fa-location-dot"></i> ' + c.d.toFixed(1) + ' كم</p>' : '');
                item.addEventListener('click', () => goTo(c));
                item.addEventListener('mouseenter', () => highlightPin(c.id, true));
                item.addEventListener('mouseleave', () => highlightPin(c.id, false));
                listEl.appendChild(item);
                listItems[c.id] = item;
            });

            cluster.addLayers(layers);

            if (fit) {
                if (bounds.length === 1) map.flyTo(bounds[0], 14, { duration: 1 });
                else map.flyToBounds(bounds, { padding: [50, 50], duration: 1, maxZoom: 14 });
            }
        }

        // ===== أحداث الواجهة =====
        // عدّاد المراكز بجانب كل محافظة
        (function addCounts() {
            const sel = document.getElementById('gov-select');
            Array.from(sel.options).forEach(o => {
                if (o.value === 'all') return;
                const n = centers.filter(c => c.gov === o.value).length;
                o.textContent = o.value + ' (' + n + ')';
            });
        })();

        document.getElementById('gov-select').addEventListener('change', function () {
            state.gov = this.value; render(true);
        });

        document.getElementById('type-chips').addEventListener('click', function (e) {
            const btn = e.target.closest('.chip'); if (!btn) return;
            this.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            state.type = btn.dataset.type; render(true);
        });

        const searchInput = document.getElementById('search');
        const clearBtn = document.getElementById('search-clear');
        let searchTimer;
        searchInput.addEventListener('input', function () {
            clearBtn.style.display = this.value ? 'block' : 'none';
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => { state.q = this.value; render(true); }, 250);
        });
        clearBtn.addEventListener('click', () => {
            searchInput.value = ''; clearBtn.style.display = 'none';
            state.q = ''; render(true); searchInput.focus();
        });

        // أقرب مركز لي
        const locateBtn = document.getElementById('locate-btn');
        locateBtn.addEventListener('click', () => {
            if (!navigator.geolocation) { alert('المتصفح لا يدعم تحديد الموقع'); return; }
            locateBtn.classList.add('loading');
            navigator.geolocation.getCurrentPosition(pos => {
                locateBtn.classList.remove('loading');
                state.user = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                if (userMarker) map.removeLayer(userMarker);
                userMarker = L.marker([state.user.lat, state.user.lng], {
                    icon: L.divIcon({ className: 'pin-wrap', html: '<span class="me-dot"></span>', iconSize: [22, 22], iconAnchor: [11, 11] }),
                    zIndexOffset: 1000
                }).addTo(map).bindPopup('موقعك الحالي');
                render(false);
                const nearest = getFiltered()[0];
                if (nearest) goTo(nearest);
            }, err => {
                locateBtn.classList.remove('loading');
                alert('تعذر تحديد موقعك. تأكد من السماح بالوصول للموقع، وأن الصفحة تعمل عبر HTTPS.');
            }, { enableHighAccuracy: true, timeout: 10000 });
        });

        // زر إعادة عرض كل المراكز
        const ResetCtl = L.Control.extend({
            options: { position: 'topleft' },
            onAdd: function () {
                const div = L.DomUtil.create('div', 'leaflet-bar');
                const a = L.DomUtil.create('a', 'reset-btn', div);
                a.href = '#'; a.title = 'عرض كل المراكز'; a.innerHTML = '<i class="fa-solid fa-expand"></i>';
                L.DomEvent.disableClickPropagation(div);
                L.DomEvent.on(a, 'click', e => {
                    L.DomEvent.preventDefault(e);
                    map.flyToBounds(centers.map(c => [c.lat, c.lng]), { padding: [50, 50], duration: 1 });
                });
                return div;
            }
        });
        new ResetCtl().addTo(map);

        // مفتاح الخريطة
        const legend = L.control({ position: 'bottomleft' });
        legend.onAdd = function () {
            const d = L.DomUtil.create('div', 'legend');
            d.innerHTML =
                '<i style="background:#f6511d"></i>عيادة<br>' +
                '<i style="background:#a855f7"></i>مركز دعم وتمكين المرأة<br>' +
                '<i style="background:#14b8a6"></i>أخرى';
            return d;
        };
        legend.addTo(map);

        // ===== البداية =====
        render(false);
        map.fitBounds(centers.map(c => [c.lat, c.lng]), { padding: [40, 40] });
        window.addEventListener('load', () => map.invalidateSize());
    </script>

</body>
</html>
